<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Padel Rivals</title>
<meta name="description" content="Download Padel Rivals on the App Store or Google Play, and join the WhatsApp group for tournament news.">
<meta property="og:title" content="Get Padel Rivals">
<meta property="og:description" content="Padel tournaments, ranked. Download the app and join the WhatsApp group.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://padel-rivals.com/logo.jpg">
<meta name="theme-color" content="#131D18">
<link rel="icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #131D18;
    --ink: #F4EFE2;
    --muted: rgba(244, 239, 226, 0.72);
    --line: rgba(244, 239, 226, 0.18);
    --clay: #E0592D;
    --card: rgba(244, 239, 226, 0.06);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Outfit', system-ui, sans-serif;
    display: flex;
    justify-content: center;
  }
  main {
    width: 100%;
    max-width: 440px;
    padding: 40px 16px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .logo {
    width: 128px;
    height: 128px;
    border-radius: 30px;
    object-fit: cover;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
  }
  .kicker {
    margin: 28px 0 0;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 4px;
    color: var(--clay);
  }
  h1 {
    margin: 10px 0 0;
    font-size: 44px;
    line-height: 0.95;
    font-weight: 900;
    letter-spacing: -1px;
  }
  .lead {
    margin: 14px 0 0;
    font-size: 17px;
    line-height: 1.45;
    color: var(--muted);
  }
  .buttons {
    width: 100%;
    margin-top: 32px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .btn {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    min-height: 64px;
    padding: 12px 20px;
    border-radius: 16px;
    border: 1.5px solid var(--line);
    background: var(--card);
    color: var(--ink);
    text-decoration: none;
    text-align: left;
    transition: transform 0.12s ease, border-color 0.12s ease;
  }
  .btn:hover { border-color: var(--ink); }
  .btn:active { transform: scale(0.98); }
  .btn:focus-visible { outline: 3px solid var(--clay); outline-offset: 2px; }
  .btn svg { flex: none; width: 30px; height: 30px; }
  .btn .small { display: block; font-size: 12px; color: var(--muted); }
  .btn .big { display: block; font-size: 19px; font-weight: 800; }
  .btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .btn.primary .small { color: rgba(19, 29, 24, 0.7); }
  .btn.whatsapp { margin-top: 12px; background: #1F7A4A; border-color: #1F7A4A; color: #fff; }
  .btn.whatsapp .small { color: rgba(255, 255, 255, 0.8); }
  .divider {
    width: 100%;
    margin-top: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
    color: var(--muted);
  }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  footer {
    margin-top: 40px;
    font-size: 13px;
    color: var(--muted);
  }
  footer a { color: var(--muted); }
  footer a:hover { color: var(--ink); }
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.jpg" alt="Padel Rivals logo" width="128" height="128">
  <p class="kicker">PADEL RIVALS</p>
  <h1>Padel tournaments, ranked.</h1>
  <p class="lead">Pair up, win the bracket and climb the season ladder. Get the app, then join the group for tournament news.</p>

  <div class="buttons" id="stores">
    <a class="btn" id="ios" href="https://apps.apple.com/app/id6786002098" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.37 12.6c-.02-2.2 1.8-3.26 1.88-3.31-1.03-1.5-2.62-1.7-3.18-1.73-1.35-.14-2.64.8-3.33.8-.69 0-1.74-.78-2.86-.76-1.47.02-2.83.86-3.59 2.17-1.53 2.66-.39 6.6 1.1 8.76.73 1.06 1.6 2.24 2.73 2.2 1.1-.04 1.51-.71 2.84-.71 1.32 0 1.7.71 2.86.69 1.18-.02 1.93-1.07 2.65-2.13.84-1.22 1.18-2.41 1.2-2.47-.03-.01-2.3-.88-2.3-3.51zM14.2 6.13c.6-.74 1.01-1.75.9-2.77-.87.04-1.93.58-2.55 1.31-.56.65-1.05 1.69-.92 2.69.97.07 1.96-.49 2.57-1.23z"/></svg>
      <span><span class="small">Download on the</span><span class="big">App Store</span></span>
    </a>
    <a class="btn" id="android" href="https://play.google.com/store/apps/details?id=com.padelegypt.app" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.6 2.3c-.2.2-.3.6-.3 1v17.4c0 .4.1.8.3 1l9.7-9.7L3.6 2.3zm10.8 10.8 2.6 2.6-11.6 6.6c-.3.2-.7.2-1 .1l10-9.3zm0-2.2L4.4 1.6c.3-.1.7-.1 1 .1l11.6 6.6-2.6 2.6zm3.6 4.1-2.9-2.9 2.9-2.9 3.3 1.9c.9.5.9 1.5 0 2l-3.3 1.9z"/></svg>
      <span><span class="small">Get it on</span><span class="big">Google Play</span></span>
    </a>
  </div>

  <div class="divider">then</div>

  <div class="buttons" style="margin-top: 0">
    <a class="btn whatsapp" href="https://chat.whatsapp.com/G5Qhis94M9N611c8ztJbYP" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21c5.46 0 9.91-4.45 9.91-9.91C21.95 6.45 17.5 2 12.04 2zm5.8 14.05c-.24.68-1.42 1.3-1.95 1.34-.5.05-.97.22-3.27-.68-2.77-1.09-4.52-3.92-4.66-4.1-.13-.18-1.1-1.47-1.1-2.8 0-1.33.7-1.99.95-2.26.25-.27.54-.34.72-.34h.52c.17 0 .4-.06.62.47.24.56.8 1.94.87 2.08.07.14.11.3.02.48-.09.18-.14.3-.27.46-.14.16-.29.36-.41.48-.14.14-.28.29-.12.56.16.27.71 1.17 1.52 1.9 1.05.93 1.93 1.22 2.2 1.36.27.14.43.11.59-.07.16-.18.68-.79.86-1.06.18-.27.36-.23.61-.14.25.09 1.59.75 1.86.89.27.14.45.2.52.32.07.11.07.66-.17 1.33z"/></svg>
      <span><span class="small">Tournament news &amp; draws</span><span class="big">Join the WhatsApp group</span></span>
    </a>
  </div>

  <footer>
    <a href="/">padel-rivals.com</a> · <a href="/privacy">Privacy</a> · <a href="/terms">Terms</a>
  </footer>
</main>
<script>
  // Put the visitor's own store first and highlight it. Without JS both
  // buttons still show, in the default order.
  (function () {
    var ua = navigator.userAgent || '';
    var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var isAndroid = /Android/i.test(ua);
    var stores = document.getElementById('stores');
    var ios = document.getElementById('ios');
    var android = document.getElementById('android');
    if (isAndroid) {
      stores.insertBefore(android, ios);
      android.classList.add('primary');
    } else if (isIOS) {
      ios.classList.add('primary');
    }
  })();
</script>
</body>
</html>
