name: padel_clay
description: Padel Rivals — Flutter app (player + admin) on Supabase.
publish_to: "none"
version: 1.2.0+7

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.6
  # Pinned exact: 2.13+ (gotrue 2.22) pulls passkeys -> device_info_plus 13,
  # which breaks the iOS CI build. We don't use passkeys. See project memory.
  supabase_flutter: 2.12.4
  url_launcher: ^6.3.0
  flutter_web_auth_2: ^4.0.0
  # Native "Sign in with Apple" on iOS (idToken -> Supabase signInWithIdToken).
  sign_in_with_apple: ^6.1.0
  crypto: ^3.0.3
  image_picker: ^1.1.2
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/brand/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/logo.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#0E1A17"
  adaptive_icon_foreground: "assets/icon/logo.png"
